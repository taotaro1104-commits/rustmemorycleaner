[package]
name = "memopt-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "memopt-cli"
path = "src/main.rs"

[dependencies]
memopt-core = { path = "../../crates/core" }
memopt-probe = { path = "../../crates/probe" }
memopt-policy = { path = "../../crates/policy" }
memopt-cleaner = { path = "../../crates/cleaner" }
memopt-store = { path = "../../crates/store" }
memopt-actions = { path = "../../crates/actions" }
memopt-grouping = { path = "../../crates/grouping" }
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_json.workspace = true
windows-service = "0.7"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"]
