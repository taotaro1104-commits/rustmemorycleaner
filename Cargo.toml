[workspace]
resolver = "2"
members = ["apps/cli", "apps/service","apps/tray","crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
